# MARU 팔 관절별 영점(zero-offset) 보정 설정
# ============================================================
# 보정식 (전체 파이프라인에서 공통으로 적용):
#   actual_joint_angle = raw_encoder_angle - zero_offset
#   actual_limit       = raw_limit        - zero_offset
#
# - raw_max/raw_min : 실측 인코더 원시값 기준 리미트 (rad)
# - zero_offset     : 관절별 독립 상수. 홈 자세(actual=0)에서 인코더가 실제로
#                      몇 rad을 읽는지 실측하기 전까지는 0으로 둔다(placeholder).
#
# 엔코더 영점은 모든 조인트가 천장을 향해 완전히 올라간 자세로 설정되어 있다.
# 따라서 아래 raw limit은 해당 영점 기준의 실측 encoder-radian 값이며,
# zero_offset=0.0이면 URDF/MoveIt actual limit과 동일하다.
# 아래 값은 2026-08 실측값이다.
#
# [갱신, 2026-08-31] capture_arm_pose.py로 HOME/HOLD/GRASP_WAIT 자세를
# 하드스톱 직전까지 손으로 밀어서 재실측한 결과, shoulder_joint raw_min과
# elbow_joint/wrist_joint raw_max가 기존 값(원래 진짜 하드스톱에서 5° 마진을
# 두고 설정했던 값)보다도 실제 하드스톱이 더 바깥쪽에 있는 게 확인됨(약 1~2°
# 차이 - 재조립/마모 등으로 하드스톱 위치 자체가 살짝 이동했을 가능성).
# 아래는 새로 확인된 하드스톱 지점에서 다시 2° 마진을 뺀 값이다(기존 5°보다
# 좁지만, 방금 실측한 진짜 하드스톱 기준이라 이전 값보다 신뢰도가 높음).
# shoulder_joint raw_max(양의 방향)/base_joint/gripper_joint는 이번에 재검증
# 안 됨 - 기존 값 유지.
#
# [갱신, 2026-08-31 #2] 구동부에 기대 눕는 "bed" 자세(shoulder=-1.49610,
# wrist=1.55648, capture_arm_pose.py로 실측)가 위 2° 마진 리미트를 약간
# 벗어나서, shoulder_joint raw_min/wrist_joint raw_max를 bed 자세가 들어오는
# 값으로 다시 넓힘 - 하드스톱(shoulder -1.51669, wrist 1.56783) 안쪽이라
# 안전(마진 각각 ~1.18°, ~0.65°로 줄었지만 여전히 양수).
#
# [갱신, 2026-09-01] supplybox 파지 자세(/joint_states 실측: shoulder=-1.52926,
# elbow=1.66400, wrist=1.63817)가 바로 위 #2 갱신의 하드스톱 기록(shoulder
# -1.51669, elbow 1.67325, wrist 1.56783)을 shoulder/wrist에서 이미 넘어서는
# 게 확인됨 - 무리한 진동/과전류 없이 자연스럽게 도달한 값이라 저 하드스톱
# 기록 쪽이 재검증 전이라 신뢰할 수 없는 상태로 판단. 파지 자세가 항상
# 가능해야 하므로 shoulder_joint raw_min/elbow_joint raw_max/wrist_joint
# raw_max를 이 실측값 + 0.3° 여유로 확장(기존 2° 관례보다 훨씬 좁음 - 진짜
# 하드스톱 위치를 아직 모르는 상태라 과하게 벌리지 않기 위함). shoulder_joint
# raw_max(1.71548)는 이번 실측(1.72997, 완전히 멈춘 값 2회 재현 - 진짜
# 하드스톱으로 판단)으로 마진 없이 그대로 교체. **TODO: 세 관절 모두
# capture_arm_pose.py로 실제 하드스톱을 다시 재측정해서 정식 마진을 다시
# 잡을 것.**
#
# [갱신, 2026-09-01 #2] 실제 카메라가 원거리(x0≈0.6~0.75m) supplybox를 인식한
# 뒤 그걸 잡는 자세를 재실측(capture_arm_pose.py)했더니 shoulder가
# 1.73608까지 감(위에서 "하드스톱으로 판단"했던 1.72997을 다시 넘음, 무리
# 없이 자연스럽게 도달 확인). 즉 1.72997도 아직 진짜 하드스톱이 아니었던
# 것으로 판명 - shoulder_joint raw_max를 이 실측값 + 0.3° 여유로 다시 확장.
# 위 TODO(실제 하드스톱 재측정)가 여전히 유효함.
#
# [갱신, 2026-09-03] 지면 높이 supplybox 파지를 위해 손으로 직접 arm을
# 내려서(capture_arm_pose.py) 재확인한 결과 shoulder가 1.74376까지 무리
# 없이 자연스럽게 감(위 #2의 1.73608도 다시 넘음, 하드스톱 아님 재확인).
# 이 값 때문에 자동 파지 시퀀스의 compute_ik 해가 raw_max(1.74132)를
# 0.14°(0.00244rad) 초과해 _solve_ik_multi_seed의 리미트 재검증에서 매번
# 버려지고 있었다(실측으로는 명백히 안전한 자세인데 소프트 리미트가 그보다
# 좁았던 경우) - shoulder_joint raw_max를 이 실측값 + 0.3° 여유로 다시
# 확장. 위 TODO(실제 하드스톱 재측정)가 여전히 유효함.
joints:
  base_joint:
    raw_max: 1.72113
    raw_min: -1.46955
    zero_offset: 0.0
  shoulder_joint:
    raw_max: 1.74900  # 2026-09-03 지면 파지 실측(1.74376) + 0.3° 여유(하드스톱 미확인)
    raw_min: -1.53450  # 2026-09-01 supplybox 파지 실측(-1.52926) + 0.3° 여유(하드스톱 미확인)
    zero_offset: 0.0
  elbow_joint:
    raw_max: 1.66923  # 2026-09-01 supplybox 파지 실측(1.66400) + 0.3° 여유(하드스톱 미확인)
    raw_min: -1.63541
    zero_offset: 0.0
  wrist_joint:
    raw_max: 1.78041  # 2026-09-05 동작 범위 확장을 위해 갱신(하드스톱 미확인)
    raw_min: -1.78041  # 2026-09-05 동작 범위 확장을 위해 갱신(하드스톱 미확인)
    zero_offset: 0.0
  gripper_joint:
    raw_max: 2.59396
    raw_min: 0.0
    zero_offset: 0.0
