# MARU 팔 관절별 영점(zero-offset) 보정 설정
# ============================================================
# 보정식 (전체 파이프라인에서 공통으로 적용):
#   actual_joint_angle = raw_encoder_angle - zero_offset
#   actual_limit       = raw_limit        - zero_offset
#
# - raw_max/raw_min : 실측 인코더 원시값 기준 리미트 (rad)
# - zero_offset     : 관절별 독립 상수. 홈 자세(actual=0)에서 인코더가 실제로
#                      몇 rad을 읽는지 실측하기 전까지는 0으로 둔다(placeholder).
#
# [수정] 회전 조인트 5개 전부 리미트를 ±150°(±2.6180 rad)로, zero_offset을 0으로
# 리셋했다 - raw_limit이 이미 대칭이라 actual_limit = raw_limit 그대로이고, 0이
# 정확히 리미트 중앙(원점)이 된다. 이전의 "중간값을 zero_offset에 넣어 0을
# 중앙으로 맞추던" 임시방편은 더 이상 필요 없음.
# TODO(zero-offset): 위 ±150° 자체도 실측치가 아니라 임시값이다. 실측 후 이
# 파일의 raw_min/raw_max/zero_offset만 갱신하면 URDF(xacro property)와 IK 노드
# (joint_calibration.py) 양쪽에 동일하게 반영된다. 다른 파일은 손댈 필요 없음.
# ============================================================
joints:
  base_joint:
    raw_max: 2.6180
    raw_min: -2.6180
    zero_offset: 0.0
  shoulder_lift_joint:
    raw_max: 2.6180
    raw_min: -2.6180
    zero_offset: 0.0
  elbow_joint:
    raw_max: 2.6180
    raw_min: -2.6180
    zero_offset: 0.0
  wrist_joint:
    raw_max: 2.6180
    raw_min: -2.6180
    zero_offset: 0.0
  gripper_joint:
    raw_max: 2.6180
    raw_min: -2.6180
    zero_offset: 0.0
