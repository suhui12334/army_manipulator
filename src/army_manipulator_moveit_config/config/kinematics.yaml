# [수정] Setup Assistant가 cached_ik_kinematics_plugin/CachedKDLKinematicsPlugin으로
# 바꿔놨는데 이 패키지가 시스템에 설치되어 있지 않다(apt list에 없음) - 그대로 두면
# move_group이 kinematics solver 로드에 실패한다. 실제 설치되어 검증된
# kdl_kinematics_plugin으로 되돌렸다.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  # [수정] 0.005s(5ms)/3회는 KDL(수치해석 IK)이 이 4DOF+방향제약 목표를 풀기엔
  # 너무 빡빡함 - 심지어 "팔이 지금 있는 그 자리"를 그대로 목표로 줘도
  # NO_IK_SOLUTION(-31)이 나는 걸 compute_ik로 직접 확인함. 여유있게 올림.
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 10
