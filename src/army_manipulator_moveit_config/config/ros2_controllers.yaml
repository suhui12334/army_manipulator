# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    army_manipulation:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

army_manipulation:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_joint
      - gripper_joint
      - gripper_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity